<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#341f2e" />
      <stop offset="100%" stop-color="#18131d" />
    </linearGradient>
    <linearGradient id="lp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(244, 114, 182, 0.55)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.2)" />
    </linearGradient>
  </defs>
  <!-- Background circular badge -->
  <circle cx="32" cy="32" r="30" fill="url(#lp-bg)" stroke="url(#lp-border)" stroke-width="2" />
  <!-- Monogram LP -->
  <text x="32" y="42" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">LP</text>
</svg>
